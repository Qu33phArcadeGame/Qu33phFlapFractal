<style>
  :root{
    --red-hi:#f0505f;
    --red-lo:#7a0f1f;
    --ink:#0b0a16;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--ink);
    font-family:'Baloo 2', system-ui, sans-serif;
    color:#fff;
  }
  #app{
    display:flex; flex-direction:column;
    height:100dvh; width:100vw;
    background:radial-gradient(120% 100% at 50% 0%, #1b1436 0%, #0b0a16 70%);
  }
  /* ---- video ---- */
  #videoWrap{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#000; flex:0 0 auto;
    border-bottom:2px solid #1a1030;
  }
  #videoWrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  /* ---- wordmark ---- */
  #brand{
    flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:6px 8px 4px; user-select:none;
  }
  #brand img{ height:30px; width:auto; filter:drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #flapWord{
    font-family:'Baloo 2', sans-serif; font-weight:800; font-style:italic;
    font-size:30px; letter-spacing:1px; line-height:1;
    transform:skewX(-6deg);
    background:linear-gradient(180deg, var(--red-hi) 0%, var(--red-lo) 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    -webkit-text-stroke:2.5px #000; paint-order:stroke fill;
    filter:drop-shadow(0 2px 0 #000);
  }

  /* ---- game ---- */
  #gameWrap{ position:relative; flex:1 1 auto; min-height:0; width:100%; }
  #game{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
</style>

<script>
(function(){
  "use strict";
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('gameWrap');
  var W=0, H=0, DPR=1;

  function resize(){
    var r = wrap.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    W = r.width; H = r.height;
    canvas.width = Math.round(W*DPR);
    canvas.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize,150); });
  resize();

  // ---------- persistent high score ----------
  var HS_KEY = 'qu33ph-flap-highscore';
  var highScore = 0;
  (async function loadHS(){
    try{
      var res = await window.storage.get(HS_KEY, false);
      if(res && res.value){ highScore = parseInt(res.value,10)||0; }
    }catch(e){ /* no saved score yet, or storage unavailable */ }
  })();
  async function saveHS(v){
    highScore = v;
    try{ await window.storage.set(HS_KEY, String(v), false); }catch(e){}
  }

  function haptic(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

  // ---------- game constants (fractions of canvas size, feel tuned to play like classic flappy) ----------
  var PIPE_COLORS = ['#ff3b4a', '#38d66b', '#3b8bff']; // red / green / blue cycle
  var GLOW = { '#ff3b4a':'#ff3b4a', '#38d66b':'#38d66b', '#3b8bff':'#3b8bff' };

  var state = 'ready'; // ready | play | dead
  var bird, pipes, score, colorIdx, bobT, tPrev, spawnTimer;

  function reset(){
    bird = { x: 0, y: 0, vy: 0, r: 0, rot: 0 };
    pipes = [];
    score = 0;
    colorIdx = 0;
    bobT = 0;
    spawnTimer = 0;
    state = 'ready';
    bird.x = W*0.30;
    bird.y = H*0.42;
    bird.r = Math.max(10, Math.min(W,H)*0.032);
  }

  // reference design size — all physics is expressed relative to this, then scaled
  var REF_W = 360, REF_H = 640;

  function pipeGeom(){
    var sW = W/REF_W;
    return {
      w: Math.max(46, W*0.16),
      gapH: Math.min(Math.max(H*0.30, 140), H*0.42),
      spacing: Math.max(W*0.72, 210),
      speed: 130 * sW // px per SECOND (classic flappy-bird pace)
    };
  }

  function spawnPipe(fromX){
    var g = pipeGeom();
    var margin = H*0.14;
    var gapY = margin + Math.random()*(H - margin*2 - g.gapH) + g.gapH/2;
    var col = PIPE_COLORS[colorIdx % PIPE_COLORS.length]; colorIdx++;
    pipes.push({ x: fromX, w: g.w, gapY: gapY, gapH: g.gapH, passed:false, color: col });
  }

  function startGame(){
    state = 'play';
    pipes = [];
    score = 0;
    var g = pipeGeom();
    var x0 = W + g.w;
    for(var i=0;i<3;i++){ spawnPipe(x0 + i*g.spacing); }
    flap();
  }

  function flap(){
    var sH = H/REF_H;
    bird.vy = -430 * sH; // px per SECOND, upward
    haptic(9);
  }

  function onTap(){
    if(state === 'ready'){ startGame(); }
    else if(state === 'play'){ flap(); }
    else if(state === 'dead'){ reset(); }
  }
  canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); onTap(); }, {passive:false});
  window.addEventListener('keydown', function(e){
    if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); onTap(); }
  });

  function die(){
    if(state !== 'play') return;
    state = 'dead';
    haptic([15,40,15]);
    if(score > highScore) saveHS(score);
  }

  function update(dt){
    var dts = dt/1000; // dt arrives in ms; convert to seconds for all physics below
    var g = pipeGeom();
    var sH = H/REF_H;
    var gravity = 1700 * sH;     // px per second^2
    var maxFall = 620 * sH;      // terminal velocity so it never tunnels through a pipe
    var speed = g.speed;         // px per second

    if(state === 'ready'){
      bobT += dt;
      bird.y = H*0.42 + Math.sin(bobT*0.0028)*H*0.025;
      bird.rot = 0;
      return;
    }
    if(state === 'dead'){
      bird.vy = Math.min(maxFall, bird.vy + gravity*1.2*dts);
      bird.y += bird.vy*dts;
      var floor = H - bird.r - 2;
      if(bird.y > floor){ bird.y = floor; bird.vy = 0; }
      bird.rot = Math.min(1.4, bird.rot + dts*1.6);
      return;
    }

    // play
    bird.vy = Math.min(maxFall, bird.vy + gravity*dts);
    bird.y += bird.vy*dts;
    bird.rot = Math.max(-0.5, Math.min(1.3, bird.vy*0.0022));

    if(bird.y - bird.r < 0){ bird.y = bird.r; bird.vy = 0; }
    if(bird.y + bird.r > H){ bird.y = H - bird.r; die(); }

    for(var i=0;i<pipes.length;i++){
      var p = pipes[i];
      p.x -= speed*dts;
      if(!p.passed && p.x + p.w < bird.x - bird.r){
        p.passed = true; score++; haptic(8);
      }
      var withinX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w;
      if(withinX){
        var halfGap = p.gapH/2;
        if(bird.y - bird.r < p.gapY - halfGap || bird.y + bird.r > p.gapY + halfGap){
          die();
        }
      }
    }
    // recycle / spawn
    while(pipes.length && pipes[0].x + pipes[0].w < -10) pipes.shift();
    var last = pipes[pipes.length-1];
    if(last && last.x < W){ spawnPipe(last.x + g.spacing); }
  }

  function drawBackdrop(){
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0,'#171034');
    grad.addColorStop(1,'#0b0a16');
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    // soft static stars
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    for(var i=0;i<STAR_COUNT;i++){
      var s = stars[i];
      ctx.globalAlpha = s.a;
      ctx.beginPath(); ctx.arc(s.x*W, s.y*H, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  var STAR_COUNT = 40, stars = [];
  for(var i=0;i<STAR_COUNT;i++){ stars.push({x:Math.random(), y:Math.random(), r:0.6+Math.random()*1.4, a:0.15+Math.random()*0.5}); }

  function drawPipes(){
    for(var i=0;i<pipes.length;i++){
      var p = pipes[i];
      var glow = p.color;
      var halfGap = p.gapH/2;
      ctx.save();
      ctx.shadowColor = glow; ctx.shadowBlur = 12;
      ctx.fillStyle = glow;
      // top pillar
      roundRectFill(p.x, -4, p.w, (p.gapY - halfGap) + 4, 8);
      // bottom pillar
      roundRectFill(p.x, p.gapY + halfGap, p.w, H - (p.gapY + halfGap) + 4, 8);
      ctx.restore();
      // bright caps
      ctx.save();
      ctx.fillStyle = '#fff'; ctx.shadowColor = glow; ctx.shadowBlur = 10;
      ctx.fillRect(p.x-2, p.gapY-halfGap-5, p.w+4, 5);
      ctx.fillRect(p.x-2, p.gapY+halfGap, p.w+4, 5);
      ctx.restore();
    }
  }
  function roundRectFill(x,y,w,h,r){
    if(h<=0) return;
    r = Math.min(r, w/2, Math.max(0,h/2));
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath(); ctx.fill();
  }

  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.rot);
    var grad = ctx.createLinearGradient(0,-bird.r,0,bird.r);
    grad.addColorStop(0,'#f0505f'); grad.addColorStop(1,'#7a0f1f');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(2, bird.r*0.18);
    ctx.beginPath(); ctx.arc(0,0,bird.r,0,6.283); ctx.fill(); ctx.stroke();
    // little wing
    ctx.fillStyle = '#3b8bff';
    ctx.beginPath(); ctx.ellipse(-bird.r*0.15, bird.r*0.1, bird.r*0.55, bird.r*0.35, 0.3, 0, 6.283); ctx.fill();
    ctx.strokeStyle='#000'; ctx.lineWidth=Math.max(1.5,bird.r*0.12); ctx.stroke();
    // eye
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(bird.r*0.35,-bird.r*0.25,bird.r*0.26,0,6.283); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(bird.r*0.42,-bird.r*0.25,bird.r*0.12,0,6.283); ctx.fill();
    ctx.restore();
  }

  function drawHud(){
    ctx.save();
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.font = '800 20px Baloo 2, Arial, sans-serif';
    ctx.fillStyle = '#fff'; ctx.shadowColor='rgba(0,0,0,0.6)'; ctx.shadowBlur=4;
    ctx.fillText('\u00d7'+score, 12, 10);
    ctx.font = '700 12px Baloo 2, Arial, sans-serif';
    ctx.fillStyle = '#8affea'; ctx.shadowColor='#8affea'; ctx.shadowBlur=6;
    ctx.fillText('BEST \u00d7'+highScore, 12, 36);
    ctx.restore();

    if(state==='ready'){
      centerText('TAP TO FLAP', H*0.66, 22, '#fff');
    } else if(state==='dead'){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,0,W,H);
      ctx.restore();
      centerText('GAME OVER', H*0.4, 30, '#f0505f');
      centerText('\u00d7'+score, H*0.4+40, 24, '#fff');
      centerText('tap to retry', H*0.4+78, 16, '#cfcfe8');
    }
  }
  function centerText(txt, y, size, color){
    ctx.save();
    ctx.textAlign='center'; ctx.textBaseline='top';
    ctx.font = '800 '+size+'px Baloo 2, Arial, sans-serif';
    ctx.fillStyle = color; ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=6;
    ctx.fillText(txt, W/2, y);
    ctx.restore();
  }

  function frame(t){
    if(!tPrev) tPrev = t;
    var dt = Math.min(40, t - tPrev);
    tPrev = t;
    update(dt);
    drawBackdrop();
    drawPipes();
    drawBird();
    drawHud();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
